# En-têtes de sécurité, inclus au niveau du serveur ET dans chaque location
# qui déclare son propre add_header : Nginx n'hérite des add_header du niveau
# supérieur que si la location n'en déclare aucun.

# Tout vient de la même origine : aucun script, style ou appel externe, aucun
# script ni style en ligne (vérifié sur index.html, gestion-quiz.html, main.js
# et admin.js).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Ignoré par les navigateurs en HTTP (local) ; effectif derrière l'HTTPS de
# Container Apps.
add_header Strict-Transport-Security "max-age=31536000" always;
