# Réglages communs aux locations relayées vers le backend.

proxy_http_version 1.1;

# Le backend (Express, « trust proxy 2 ») déduit l'adresse du client de
# X-Forwarded-For. Nginx lui transmet uniquement l'adresse réelle du client
# (voir real_ip dans default.conf.template) au lieu d'allonger la chaîne :
# une valeur forgée par le client ne peut donc pas passer.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Forwarded-Host $host;

proxy_hide_header X-Powered-By;

proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
