# Contrôles obligatoires avant fusion dans main.
#
# Une PR ne pousse aucune image et ne déploie rien : elle construit, scanne et
# teste localement sur le runner. La publication et le déploiement se font
# après fusion (workflow cd.yml).
#
# Les actions tierces sont épinglées par SHA de commit (un tag peut être
# déplacé, un SHA non) ; Dependabot propose les mises à jour.

name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Moindre privilège : lecture seule par défaut, élargie job par job si besoin.
permissions:
  contents: read

# Un nouveau push sur la PR annule le passage précédent, devenu inutile.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HADOLINT_IMAGE: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

jobs:
  lint:
    name: Lint et configuration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: hadolint (Dockerfiles)
        run: |
          for dockerfile in Dockerfile backend/Dockerfile database/Dockerfile; do
            echo "::group::$dockerfile"
            docker run --rm -i "$HADOLINT_IMAGE" < "$dockerfile"
            echo "::endgroup::"
          done

      - name: shellcheck (scripts)
        run: shellcheck scripts/*.sh

      - name: actionlint (workflows)
        run: docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" -color

      - name: Docker Compose (validation)
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Trivy (mauvaises configurations)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          exit-code: "1"

      - name: Trivy (secrets dans le dépôt)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: "1"

  images:
    name: Image ${{ matrix.service }} (build et Trivy)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # publier le rapport Trivy dans l'onglet Security
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: .
          - service: backend
            context: backend
          - service: db
            context: database
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Cache des couches dans le cache GitHub Actions, un par image : un
      # second passage sans changement de dépendances ne réinstalle rien.
      - name: Build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          load: true
          tags: quiz-${{ matrix.service }}:ci
          build-args: REVISION=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Exigence du sujet : toute CRITICAL fait échouer le contrôle, même sans
      # correctif publié.
      - name: Trivy (toute vulnérabilité CRITICAL bloque)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: quiz-${{ matrix.service }}:ci
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"

      # Au-delà du sujet : une HIGH bloque aussi, si un correctif existe.
      - name: Trivy (vulnérabilité HIGH corrigeable bloque)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: quiz-${{ matrix.service }}:ci
          scanners: vuln
          severity: HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy (rapport complet au format SARIF)
        if: always() && steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: quiz-${{ matrix.service }}:ci
          scanners: vuln
          format: sarif
          output: trivy-${{ matrix.service }}.sarif

      - name: Publier le rapport dans l'onglet Security
        if: always() && steps.build.outcome == 'success'
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

  integration:
    name: Intégration (Compose)
    needs: images
    runs-on: ubuntu-24.04
    env:
      # docker-compose.yml utilise ces images au lieu de reconstruire.
      FRONTEND_IMAGE: quiz-frontend:ci
      BACKEND_IMAGE: quiz-backend:ci
      DB_IMAGE: quiz-db:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Mêmes Dockerfiles, même cache que le job images : toutes les couches
      # sont reprises du cache, ce sont les images qui viennent d'être scannées.
      - name: Images depuis le cache (frontend)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.FRONTEND_IMAGE }}
          build-args: REVISION=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha,scope=frontend

      - name: Images depuis le cache (backend)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          load: true
          tags: ${{ env.BACKEND_IMAGE }}
          build-args: REVISION=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha,scope=backend

      - name: Images depuis le cache (db)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: database
          load: true
          tags: ${{ env.DB_IMAGE }}
          build-args: REVISION=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha,scope=db

      - name: Démarrer la pile
        run: |
          cp .env.example .env
          docker compose up -d --no-build --wait --wait-timeout 120

      - name: Test d'intégration
        run: ./scripts/smoke-test.sh

      - name: Journaux des services
        if: failure()
        run: docker compose logs --no-color

      - name: Arrêt
        if: always()
        run: docker compose down -v
