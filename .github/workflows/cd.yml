# Déploiement continu : après chaque fusion dans main, reconstruit et rescanne
# les images, attend une approbation, les publie dans Azure Container Registry
# puis crée une nouvelle révision des deux Container Apps.
#
# Pourquoi rescanner : la fusion par squash crée un nouveau commit ; l'image
# publiée n'est donc pas celle que la PR a scannée. Elle repasse les mêmes
# contrôles Trivy avant de quitter le runner.
#
# Connexion à Azure par OIDC : GitHub émet un jeton court pour ce job, qu'Azure
# échange contre un accès de l'identité id-quiz-github, seulement si le job
# tourne dans l'environnement « production » de ce dépôt (identifiant fédéré).
# Aucun mot de passe ni secret applicatif n'est stocké dans GitHub (ADR 0004).
#
# L'environnement « production » exige une approbation explicite et n'accepte
# que la branche main : rien n'est publié ni déployé sans validation humaine.

name: CD

on:
  push:
    branches: [main]
    # Une fusion qui ne touche que la documentation ou les preuves ne change pas
    # les images : rien à publier ni à déployer.
    paths-ignore:
      - "docs/**"
      - "preuves/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

# Un déploiement en cours n'est jamais annulé : les suivants attendent leur tour.
concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-quiz-gwc
  ACR_NAME: crquizsdedu
  FRONTEND_APP: ca-quiz-frontend
  BACKEND_APP: ca-quiz-backend

jobs:
  deploy:
    name: Publier et déployer
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: ${{ steps.verify.outputs.url }}
    permissions:
      contents: read
      id-token: write # jeton OIDC échangé contre un accès Azure
    env:
      FRONTEND_IMAGE: crquizsdedu.azurecr.io/quiz-frontend:${{ github.sha }}
      BACKEND_IMAGE: crquizsdedu.azurecr.io/quiz-backend:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # --- Construction et scan sur le runner : rien ne part sans feu vert.

      - name: Build backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          load: true
          tags: ${{ env.BACKEND_IMAGE }}
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.FRONTEND_IMAGE }}
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Trivy backend (CRITICAL bloque)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.BACKEND_IMAGE }}
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"

      - name: Trivy backend (HIGH corrigeable bloque)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.BACKEND_IMAGE }}
          scanners: vuln
          severity: HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy frontend (CRITICAL bloque)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.FRONTEND_IMAGE }}
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"

      - name: Trivy frontend (HIGH corrigeable bloque)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.FRONTEND_IMAGE }}
          scanners: vuln
          severity: HIGH
          ignore-unfixed: true
          exit-code: "1"

      # --- Publication.

      - name: Connexion à Azure (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Connexion au registre
        run: az acr login --name "$ACR_NAME"

      # Mêmes builds, repris du cache, publiés avec SBOM et provenance.
      - name: Publication backend (SBOM, provenance)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha,scope=backend
          sbom: true
          provenance: mode=max

      - name: Publication frontend (SBOM, provenance)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          sbom: true
          provenance: mode=max

      # --- Déploiement : le backend d'abord, le frontend dépend de son API.

      - name: Révisions avant déploiement
        run: |
          for app in "$BACKEND_APP" "$FRONTEND_APP"; do
            echo "### $app — avant" >> "$GITHUB_STEP_SUMMARY"
            az containerapp revision list -g "$RESOURCE_GROUP" -n "$app" \
              --query "[].{revision:name, active:properties.active, image:properties.template.containers[0].image}" -o table \
              | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Nouvelle révision du backend
        run: az containerapp update -g "$RESOURCE_GROUP" -n "$BACKEND_APP" --image "$BACKEND_IMAGE" -o none

      - name: Nouvelle révision du frontend
        run: az containerapp update -g "$RESOURCE_GROUP" -n "$FRONTEND_APP" --image "$FRONTEND_IMAGE" -o none

      - name: Vérification
        id: verify
        run: |
          url="https://$(az containerapp show -g "$RESOURCE_GROUP" -n "$FRONTEND_APP" \
            --query properties.configuration.ingress.fqdn -o tsv)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

          # Chaque application doit avoir une nouvelle révision prête.
          for app in "$BACKEND_APP" "$FRONTEND_APP"; do
            latest=$(az containerapp show -g "$RESOURCE_GROUP" -n "$app" --query properties.latestRevisionName -o tsv)
            ready=""
            for _ in $(seq 1 30); do
              ready=$(az containerapp show -g "$RESOURCE_GROUP" -n "$app" --query properties.latestReadyRevisionName -o tsv)
              [[ $ready == "$latest" ]] && break
              sleep 10
            done
            [[ $ready == "$latest" ]] || { echo "::error::$app : la révision $latest n'est jamais prête"; exit 1; }
          done

          # Zéro réplica au repos : la première requête réveille les applications.
          status=000
          for _ in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url/health" || true)
            [[ $status == 200 ]] && break
            sleep 10
          done
          [[ $status == 200 ]] || { echo "::error::$url/health répond $status"; exit 1; }

          {
            echo "### Après déploiement"
            echo "GET $url/health → 200"
            for app in "$BACKEND_APP" "$FRONTEND_APP"; do
              az containerapp revision list -g "$RESOURCE_GROUP" -n "$app" \
                --query "[].{revision:name, active:properties.active, image:properties.template.containers[0].image}" -o table
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
